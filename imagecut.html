<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能图片网格裁切工具</title>
    <!-- 引入 Tailwind CSS 进行样式设计 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 JSZip 用于打包下载 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <!-- 引入 FileSaver 用于保存文件 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <!-- 引入 OpenCV.js（用于导入后自动去除角落水印） -->
    <script>
        window.__cvState = { status: 'loading', error: '' };
        window.__cvReadyResolver = null;
        window.__cvReadyPromise = new Promise(resolve => {
            window.__cvReadyResolver = resolve;
        });

        function markCvState(status, errorMessage = '') {
            if (window.__cvState.status === 'ready' || window.__cvState.status === 'failed') return;
            window.__cvState.status = status;
            window.__cvState.error = errorMessage;
            if (window.__cvReadyResolver) {
                window.__cvReadyResolver(status === 'ready');
                window.__cvReadyResolver = null;
            }
        }

        function onOpenCvScriptLoad() {
            if (!window.cv) {
                markCvState('failed', 'OpenCV 未注入到页面');
                return;
            }
            if (typeof window.cv.Mat === 'function') {
                markCvState('ready');
                return;
            }
            const previous = window.cv.onRuntimeInitialized;
            window.cv.onRuntimeInitialized = function() {
                if (typeof previous === 'function') previous();
                markCvState('ready');
            };
        }

        function onOpenCvScriptError(errorMessage = 'OpenCV 脚本加载失败') {
            markCvState('failed', errorMessage);
        }

        function loadSingleOpenCvScript(src, timeoutMs = 15000) {
            return new Promise(resolve => {
                const script = document.createElement('script');
                let done = false;
                const finish = (ok) => {
                    if (done) return;
                    done = true;
                    clearTimeout(timer);
                    script.onload = null;
                    script.onerror = null;
                    resolve(ok);
                };
                const timer = setTimeout(() => finish(false), timeoutMs);
                script.async = true;
                script.src = src;
                script.crossOrigin = 'anonymous';
                script.onload = () => {
                    onOpenCvScriptLoad();
                    finish(true);
                };
                script.onerror = () => finish(false);
                document.head.appendChild(script);
            });
        }

        async function loadOpenCvWithFallback() {
            const candidates = [
                'https://cdn.jsdelivr.net/npm/@techstark/opencv-js@4.12.0-release.1/dist/opencv.js',
                'https://unpkg.com/@techstark/opencv-js@4.12.0-release.1/dist/opencv.js'
            ];

            for (const src of candidates) {
                const ok = await loadSingleOpenCvScript(src);
                if (ok) return;
            }
            onOpenCvScriptError('OpenCV 所有 CDN 均加载失败');
        }

        window.__waitForCv = function(timeoutMs = 7000) {
            if (window.cv && typeof window.cv.Mat === 'function') {
                window.__cvState.status = 'ready';
                return Promise.resolve(true);
            }
            if (window.__cvState.status === 'failed') return Promise.resolve(false);
            const timeoutPromise = new Promise(resolve => setTimeout(() => resolve(false), timeoutMs));
            return Promise.race([window.__cvReadyPromise, timeoutPromise]);
        };

        loadOpenCvWithFallback();
    </script>
    
    <style>
        body {
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #1a1a1a;
            color: #e5e5e5;
        }
        
        /* 自定义滚动条 */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #2d2d2d; 
        }
        ::-webkit-scrollbar-thumb {
            background: #555; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #777; 
        }

        /* 棋盘格背景 */
        .checkerboard-bg {
            background-color: #2d2d2d;
            background-image: 
                linear-gradient(45deg, #333 25%, transparent 25%), 
                linear-gradient(-45deg, #333 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #333 75%), 
                linear-gradient(-45deg, transparent 75%, #333 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }

        /* 画布容器 */
        #canvas-container {
            position: relative;
            overflow: hidden; 
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: transparent;
        }

        canvas {
            display: block;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5); 
        }

        /* 结果画廊 */
        .result-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 1rem;
            padding: 1rem;
        }

        .result-item {
            background: #2d2d2d;
            padding: 0.5rem;
            border-radius: 0.5rem;
            text-align: center;
            transition: transform 0.2s;
            border: 1px solid #444;
        }

        .result-item:hover {
            transform: translateY(-2px);
            border-color: #3b82f6;
        }

        .result-img {
            max-width: 100%;
            height: auto;
            margin-bottom: 0.5rem;
            background-image: linear-gradient(45deg, #ccc 25%, transparent 25%), linear-gradient(-45deg, #ccc 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #ccc 75%), linear-gradient(-45deg, transparent 75%, #ccc 75%);
            background-size: 10px 10px;
            background-color: white;
        }

        /* 输入框样式 */
        input[type="number"], input[type="text"], select {
            background-color: #333;
            border: 1px solid #555;
            color: white;
            padding: 0.25rem 0.5rem;
            border-radius: 0.25rem;
            width: 100%;
        }
        input[type="number"]:focus, input[type="text"]:focus, select:focus {
            outline: none;
            border-color: #3b82f6;
        }
    </style>
</head>
<body class="h-screen flex flex-col">

    <!-- 顶部导航 -->
    <header class="bg-gray-800 border-b border-gray-700 p-4 flex justify-between items-center shadow-lg z-10">
        <div class="flex items-center gap-3">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
            </svg>
            <h1 class="text-xl font-bold tracking-wide">GridSlicer <span class="text-sm font-normal text-gray-400 ml-2">图片网格裁切工具</span></h1>
        </div>
        <div>
            <a href="#" onclick="loadDemoImage()" class="text-sm text-blue-400 hover:text-blue-300 underline mr-4">加载示例图片</a>
            <button onclick="document.getElementById('fileInput').click()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-medium transition flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
                </svg>
                选择图片
            </button>
            <input type="file" id="fileInput" accept="image/*" multiple class="hidden">
        </div>
    </header>

    <!-- 主体内容 -->
    <main class="flex-1 flex overflow-hidden">
        
        <!-- 左侧控制面板 -->
        <aside class="w-80 bg-gray-900 border-r border-gray-700 p-5 overflow-y-auto flex flex-col gap-6 shadow-xl z-10">

            <!-- 0. 导入预处理 -->
            <div class="space-y-3">
                <h2 class="text-lg font-semibold text-blue-400 border-b border-gray-700 pb-2">0. 导入预处理</h2>
                <label class="flex items-start gap-2 text-sm text-gray-300">
                    <input type="checkbox" id="autoWatermarkToggle" checked class="mt-1 accent-blue-500">
                    <span>导入时自动尝试去除 <span class="text-blue-300">Nano Banana</span> 水印</span>
                </label>
                <div class="grid grid-cols-2 gap-2">
                    <button id="rerunCleanupBtn" class="bg-gray-700 hover:bg-gray-600 text-xs py-2 rounded disabled:opacity-50 disabled:cursor-not-allowed" disabled>重新去水印</button>
                    <button id="restoreOriginalBtn" class="bg-gray-700 hover:bg-gray-600 text-xs py-2 rounded disabled:opacity-50 disabled:cursor-not-allowed" disabled>恢复原图</button>
                </div>
                <div id="watermarkStatus" class="text-xs text-gray-400 bg-gray-800 p-2 rounded leading-relaxed">
                    状态：等待导入图片
                </div>
                <div id="batchInfo" class="text-xs text-gray-400 bg-gray-800 p-2 rounded leading-relaxed">
                    批量：0 张（未导入）
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <button id="prevImageBtn" class="bg-gray-700 hover:bg-gray-600 text-xs py-2 rounded disabled:opacity-50 disabled:cursor-not-allowed" disabled>上一张</button>
                    <button id="nextImageBtn" class="bg-gray-700 hover:bg-gray-600 text-xs py-2 rounded disabled:opacity-50 disabled:cursor-not-allowed" disabled>下一张</button>
                </div>
                <div class="text-[11px] text-gray-500">
                    仅处理你有权编辑的图片；检测置信度低时会启用右下角修复兜底。
                </div>
            </div>
            
            <!-- 1. 网格设置 -->
            <div class="space-y-4">
                <h2 class="text-lg font-semibold text-blue-400 border-b border-gray-700 pb-2">1. 网格设置</h2>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">行数 (Rows)</label>
                        <input type="number" id="rowsInput" value="2" min="1" class="text-center">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">列数 (Cols)</label>
                        <input type="number" id="colsInput" value="5" min="1" class="text-center">
                    </div>
                </div>
                <div class="text-xs text-gray-500 bg-gray-800 p-2 rounded">
                    提示：拖拽<span class="text-yellow-400">矩形</span>移动，拖拽<span class="text-yellow-400">边角</span>缩放。
                </div>
            </div>

            <!-- 2. 比例锁定 (新增) -->
            <div class="space-y-4">
                <h2 class="text-lg font-semibold text-blue-400 border-b border-gray-700 pb-2">2. 单格比例锁定</h2>
                
                <select id="aspectSelect" class="w-full text-sm">
                    <option value="free">自由调整 (Free)</option>
                    <option value="1">1:1 (正方形)</option>
                    <option value="1.3333">4:3</option>
                    <option value="0.75">3:4</option>
                    <option value="1.7778">16:9</option>
                    <option value="0.5625">9:16</option>
                    <option value="custom">自定义 (Custom)</option>
                </select>

                <div id="customRatioBox" class="hidden grid-cols-[1fr_auto_1fr] gap-2 items-center">
                    <input type="number" id="customW" value="2" class="text-center" placeholder="W">
                    <span class="text-gray-400 font-bold">:</span>
                    <input type="number" id="customH" value="1" class="text-center" placeholder="H">
                </div>
                
                <div class="text-xs text-gray-500">
                    * 锁定的是<span class="text-blue-400">单个格子</span>的宽高比
                </div>
            </div>

            <!-- 3. 精确位置 -->
            <div class="space-y-4">
                <h2 class="text-lg font-semibold text-blue-400 border-b border-gray-700 pb-2">3. 精确位置 (px)</h2>
                
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">起始 X</label>
                        <input type="number" id="xInput" value="0">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">起始 Y</label>
                        <input type="number" id="yInput" value="0">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">总宽度</label>
                        <input type="number" id="wInput" value="0">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">总高度</label>
                        <input type="number" id="hInput" value="0">
                    </div>
                </div>
                <div class="flex gap-2">
                     <button onclick="resetCropBox()" class="flex-1 bg-gray-700 hover:bg-gray-600 text-xs py-2 rounded">全图</button>
                     <button onclick="centerCropBox()" class="flex-1 bg-gray-700 hover:bg-gray-600 text-xs py-2 rounded">居中</button>
                </div>
            </div>

            <!-- 4. 导出 -->
            <div class="space-y-4">
                <h2 class="text-lg font-semibold text-blue-400 border-b border-gray-700 pb-2">4. 导出</h2>
                
                <div>
                    <label class="block text-xs text-gray-400 mb-1">文件名前缀</label>
                    <input type="text" id="prefixInput" value="slice" placeholder="例如: icon">
                </div>
                
                <button onclick="generateSlices()" class="w-full bg-green-600 hover:bg-green-700 text-white py-3 rounded-lg font-bold shadow-lg transform transition active:scale-95 flex justify-center items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.121 14.121L19 19m-7-7l7-7m-7 7l-2.879 2.879M12 12L9.121 9.121m0 5.758a3 3 0 10-4.243 4.243 3 3 0 004.243-4.243zm0 0L12 12m0 0h7.5" />
                    </svg>
                    开始裁切
                </button>
                <button id="batchSliceBtn" onclick="generateBatchSlicesZip()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2.5 rounded-lg font-semibold shadow transition disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                    批量裁切并下载 ZIP
                </button>
            </div>
        </aside>

        <!-- 右侧工作区 -->
        <div class="flex-1 flex flex-col min-w-0 bg-gray-800">
            <!-- 画布区域 -->
            <div class="flex-1 relative p-4 checkerboard-bg flex items-center justify-center overflow-hidden">
                <div id="canvas-container">
                    <canvas id="editorCanvas"></canvas>
                </div>
                <div id="empty-state" class="absolute text-center pointer-events-none">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-20 w-20 mx-auto text-gray-600 mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                    </svg>
                    <p class="text-xl text-gray-400 font-medium">请上传图片开始操作</p>
                </div>
            </div>

            <!-- 结果预览区 -->
            <div id="result-panel" class="h-0 transition-all duration-300 bg-gray-900 border-t border-gray-700 flex flex-col">
                <div class="p-3 bg-gray-800 border-b border-gray-700 flex justify-between items-center sticky top-0 z-20">
                    <h3 class="font-bold flex items-center gap-2">
                        <span class="w-2 h-6 bg-green-500 rounded-full"></span>
                        裁切结果预览 (<span id="count-display">0</span>)
                    </h3>
                    <div class="flex gap-2">
                        <button onclick="closeResults()" class="text-gray-400 hover:text-white px-3 py-1">关闭</button>
                        <button onclick="downloadZip()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-1.5 rounded text-sm font-medium flex items-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4-4m0 0l-4 4m4-4v12" />
                            </svg>
                            下载 ZIP 包
                        </button>
                    </div>
                </div>
                <div id="output-gallery" class="result-grid overflow-y-auto p-4 flex-1">
                    <!-- 结果将在这里生成 -->
                </div>
            </div>
        </div>
    </main>

    <script>
        // --- 变量初始化 ---
        const canvas = document.getElementById('editorCanvas');
        const ctx = canvas.getContext('2d');
        const fileInput = document.getElementById('fileInput');
        const container = document.getElementById('canvas-container');
        
        let originalImage = null; // 当前用于预览/裁切的图片（可能已去水印）
        let sourceImage = null; // 用户导入的原始图片
        let activeImageLoadToken = 0; // 防止并发导入覆盖
        let isCleanupRunning = false;
        let cleanupJobId = 0;
        let isBatchGenerating = false;
        let batchItems = [];
        let currentBatchIndex = -1;
        let nanoAlphaMapsCache = null;
        let nanoAlphaLoadPromise = null;
        const WATERMARK_STATUS_CLASSES = ['text-gray-400', 'text-blue-400', 'text-green-400', 'text-yellow-400', 'text-red-400'];
        const NANO_ALPHA_SOURCE_URLS = [
            'https://raw.githubusercontent.com/nicholasxdavis/remove-gemini-watermark/main/js/watermark-remover.js',
            'https://raw.githubusercontent.com/fekilooo/Gemini-NanoBanana-Watermark-Remover/main/content.js'
        ];
        
        // 裁切框状态 (相对于原始图片尺寸)
        let cropState = {
            x: 0,
            y: 0,
            w: 0,
            h: 0,
            isDragging: false,
            isResizing: false,
            resizeHandle: null, 
            dragStartX: 0,
            dragStartY: 0,
            initialX: 0,
            initialY: 0,
            initialW: 0,
            initialH: 0
        };

        const HANDLE_SIZE = 10; 

        // --- 事件监听 ---
        fileInput.addEventListener('change', handleFileSelect);
        document.getElementById('rerunCleanupBtn').addEventListener('click', rerunWatermarkCleanup);
        document.getElementById('restoreOriginalBtn').addEventListener('click', restoreSourceImage);
        document.getElementById('prevImageBtn').addEventListener('click', showPrevImage);
        document.getElementById('nextImageBtn').addEventListener('click', showNextImage);
        document.getElementById('autoWatermarkToggle').addEventListener('change', () => {
            const isEnabled = document.getElementById('autoWatermarkToggle').checked;
            setWatermarkStatus(
                isEnabled ? '已开启自动去水印（下次导入生效）' : '已关闭自动去水印（下次导入生效）',
                isEnabled ? 'info' : 'neutral'
            );
        });
        
        // 关键更新：行/列变化时，如果有锁定比例，需要重新计算框的大小
        ['rowsInput', 'colsInput'].forEach(id => {
            document.getElementById(id).addEventListener('input', () => {
                if(document.getElementById('aspectSelect').value !== 'free') {
                    applyAspectRatioToCurrentCrop();
                } else {
                    drawCanvas();
                }
            });
        });

        ['xInput', 'yInput', 'wInput', 'hInput'].forEach(id => {
            document.getElementById(id).addEventListener('input', updateCropFromInput);
        });

        // 比例锁定相关事件
        document.getElementById('aspectSelect').addEventListener('change', handleRatioChange);
        document.getElementById('customW').addEventListener('input', handleRatioChange);
        document.getElementById('customH').addEventListener('input', handleRatioChange);

        // 画布鼠标事件
        canvas.addEventListener('mousedown', onMouseDown);
        canvas.addEventListener('mousemove', onMouseMove);
        canvas.addEventListener('mouseup', onMouseUp);
        canvas.addEventListener('mouseleave', onMouseUp);
        
        // 触屏支持
        canvas.addEventListener('touchstart', handleTouch);
        canvas.addEventListener('touchmove', handleTouch);
        canvas.addEventListener('touchend', handleTouch);

        function handleTouch(e) {
            e.preventDefault();
            const touch = e.touches[0] || e.changedTouches[0];
            const mouseEvent = new MouseEvent(
                {touchstart:'mousedown', touchmove:'mousemove', touchend:'mouseup'}[e.type], 
                { clientX: touch.clientX, clientY: touch.clientY }
            );
            canvas.dispatchEvent(mouseEvent);
        }

        function clamp(value, min, max) {
            return Math.min(Math.max(value, min), max);
        }

        function setWatermarkStatus(message, tone = 'neutral') {
            const statusEl = document.getElementById('watermarkStatus');
            if (!statusEl) return;
            statusEl.classList.remove(...WATERMARK_STATUS_CLASSES);
            const toneClass = {
                neutral: 'text-gray-400',
                info: 'text-blue-400',
                success: 'text-green-400',
                warn: 'text-yellow-400',
                error: 'text-red-400'
            };
            statusEl.classList.add(toneClass[tone] || toneClass.neutral);
            statusEl.innerText = `状态：${message}`;
        }

        function getCurrentBatchItem() {
            if (currentBatchIndex < 0 || currentBatchIndex >= batchItems.length) return null;
            return batchItems[currentBatchIndex];
        }

        function getSafeStem(name, fallback = 'image') {
            const stem = (name || fallback).replace(/\.[^.]+$/, '');
            return stem.replace(/[^a-zA-Z0-9_\-]+/g, '_').replace(/^_+|_+$/g, '') || fallback;
        }

        function updateBatchInfo() {
            const total = batchItems.length;
            const batchInfoEl = document.getElementById('batchInfo');
            if (!batchInfoEl) return;
            if (total === 0 || currentBatchIndex < 0) {
                batchInfoEl.innerText = '批量：0 张（未导入）';
                return;
            }
            const item = getCurrentBatchItem();
            const name = item ? item.name : '未命名';
            batchInfoEl.innerText = `批量：${currentBatchIndex + 1}/${total}（${name}）`;
        }

        function updateCleanupButtonsState() {
            const hasImage = batchItems.length > 0 && currentBatchIndex >= 0;
            const isBusy = isCleanupRunning || isBatchGenerating;

            document.getElementById('rerunCleanupBtn').disabled = !hasImage || isBusy;
            document.getElementById('restoreOriginalBtn').disabled = !hasImage || isBusy;
            document.getElementById('batchSliceBtn').disabled = !hasImage || batchItems.length < 2 || isBusy;

            const prevBtn = document.getElementById('prevImageBtn');
            const nextBtn = document.getElementById('nextImageBtn');
            prevBtn.disabled = !hasImage || isBusy || currentBatchIndex <= 0;
            nextBtn.disabled = !hasImage || isBusy || currentBatchIndex >= batchItems.length - 1;

            updateBatchInfo();
        }

        function showCleanupStatusForCurrentItem() {
            const item = getCurrentBatchItem();
            if (!item) {
                setWatermarkStatus('等待导入图片', 'neutral');
                return;
            }
            const method = item.cleanupMeta?.method || 'none';
            const score = Math.round((item.cleanupMeta?.score || 0) * 100);
            if (method === 'reverse-alpha') {
                setWatermarkStatus(`当前图：已反向去印（置信度 ${score}%）`, 'success');
            } else if (method === 'inpaint-template') {
                setWatermarkStatus(`当前图：已去水印（模板置信度 ${score}%）`, 'success');
            } else if (method === 'no-watermark') {
                setWatermarkStatus('当前图：未检测到稳定水印，保留原图', 'neutral');
            } else if (method === 'reverse-unstable') {
                setWatermarkStatus('当前图：检测到反向恢复异常，已保留原图', 'warn');
            } else if (method === 'reverse-low-confidence') {
                setWatermarkStatus(`当前图：低置信度（${score}%），保留原图`, 'neutral');
            } else if (method === 'cleanup-unavailable') {
                setWatermarkStatus('当前图：去印引擎不可用，保留原图', 'warn');
            } else if (method === 'inpaint-low-confidence') {
                setWatermarkStatus('当前图：模板置信度不足，保留原图', 'neutral');
            } else if (method === 'inpaint-error') {
                setWatermarkStatus('当前图：inpaint 出错，保留原图', 'warn');
            } else if (method === 'inpaint-unavailable') {
                setWatermarkStatus('当前图：inpaint 不可用，保留原图', 'warn');
            } else if (method === 'reverse-unavailable') {
                setWatermarkStatus('当前图：反向去印不可用，保留原图', 'warn');
            } else if (method === 'patch-fallback') {
                setWatermarkStatus('当前图：使用了旧版纹理兜底结果', 'warn');
            } else if (method === 'restored') {
                setWatermarkStatus('当前图：已手动恢复原图', 'neutral');
            } else if (method === 'original') {
                setWatermarkStatus('当前图：使用原图（未去水印）', 'neutral');
            } else {
                setWatermarkStatus('当前图：已导入', 'neutral');
            }
        }

        function switchToBatchItem(index, options = {}) {
            if (index < 0 || index >= batchItems.length) return;
            const normalizedCrop = options.keepCrop ? getNormalizedCropSnapshot() : null;
            currentBatchIndex = index;
            const item = batchItems[index];
            sourceImage = item.sourceImage || null;
            const imageToShow = item.processedImage || item.sourceImage;
            if (imageToShow) {
                applyImageToEditor(imageToShow, { keepCrop: !!options.keepCrop });
                if (normalizedCrop) {
                    applyNormalizedCropSnapshot(normalizedCrop);
                }
            }
            showCleanupStatusForCurrentItem();
            updateCleanupButtonsState();
        }

        function showPrevImage() {
            if (isCleanupRunning || isBatchGenerating) return;
            if (currentBatchIndex > 0) switchToBatchItem(currentBatchIndex - 1, { keepCrop: true });
        }

        function showNextImage() {
            if (isCleanupRunning || isBatchGenerating) return;
            if (currentBatchIndex < batchItems.length - 1) switchToBatchItem(currentBatchIndex + 1, { keepCrop: true });
        }

        function createImageFromDataUrl(dataUrl) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = () => reject(new Error('处理后的图片无法加载'));
                img.src = dataUrl;
            });
        }

        function readFileAsDataUrl(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = e => resolve(e.target.result);
                reader.onerror = () => reject(new Error(`读取文件失败：${file.name || 'unknown'}`));
                reader.readAsDataURL(file);
            });
        }

        function resetBatchCollection() {
            batchItems = [];
            currentBatchIndex = -1;
            sourceImage = null;
            originalImage = null;
            generatedBlobs = [];
            cropState.x = 0;
            cropState.y = 0;
            cropState.w = 0;
            cropState.h = 0;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            document.getElementById('empty-state').style.display = 'block';
            updateCleanupButtonsState();
        }

        function normalizeCropStateWithinImage() {
            if (!originalImage) return;
            cropState.w = clamp(cropState.w, 10, originalImage.width);
            cropState.h = clamp(cropState.h, 10, originalImage.height);
            cropState.x = clamp(cropState.x, 0, originalImage.width - cropState.w);
            cropState.y = clamp(cropState.y, 0, originalImage.height - cropState.h);
        }

        function getNormalizedCropSnapshot() {
            if (!originalImage || originalImage.width <= 0 || originalImage.height <= 0) {
                return { x: 0, y: 0, w: 1, h: 1 };
            }
            return {
                x: clamp(cropState.x / originalImage.width, 0, 1),
                y: clamp(cropState.y / originalImage.height, 0, 1),
                w: clamp(cropState.w / originalImage.width, 0.01, 1),
                h: clamp(cropState.h / originalImage.height, 0.01, 1)
            };
        }

        function applyNormalizedCropSnapshot(norm) {
            if (!originalImage || !norm) return;
            cropState.x = clamp(Math.round(norm.x * originalImage.width), 0, Math.max(0, originalImage.width - 1));
            cropState.y = clamp(Math.round(norm.y * originalImage.height), 0, Math.max(0, originalImage.height - 1));
            cropState.w = clamp(Math.round(norm.w * originalImage.width), 1, originalImage.width - cropState.x);
            cropState.h = clamp(Math.round(norm.h * originalImage.height), 1, originalImage.height - cropState.y);
            updateInputsFromCrop();
            drawCanvas();
        }

        function applyImageToEditor(image, options = {}) {
            const keepCrop = !!options.keepCrop;
            const canKeepCrop = keepCrop && originalImage &&
                originalImage.width === image.width &&
                originalImage.height === image.height;

            originalImage = image;
            canvas.width = originalImage.width;
            canvas.height = originalImage.height;
            document.getElementById('empty-state').style.display = 'none';

            if (canKeepCrop) {
                normalizeCropStateWithinImage();
                updateInputsFromCrop();
                drawCanvas();
                return;
            }

            cropState.x = 0;
            cropState.y = 0;
            cropState.w = originalImage.width;
            cropState.h = originalImage.height;

            if (document.getElementById('aspectSelect').value !== 'free') {
                applyAspectRatioToCurrentCrop();
            } else {
                updateInputsFromCrop();
                drawCanvas();
            }
        }

        async function fetchTextWithTimeout(url, timeoutMs = 12000) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), timeoutMs);
            try {
                const res = await fetch(url, {
                    signal: controller.signal,
                    cache: 'force-cache'
                });
                if (!res.ok) {
                    throw new Error(`HTTP ${res.status}`);
                }
                return await res.text();
            } finally {
                clearTimeout(timer);
            }
        }

        function extractDataUrlFromScript(source, varNames) {
            for (const varName of varNames) {
                const escaped = varName.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                const regex = new RegExp(
                    `(?:const|var|let)\\s+${escaped}\\s*=\\s*([\"'\\\`])(data:image\\/png;base64,[^\"'\\\`]+)\\1`
                );
                const match = source.match(regex);
                if (match && match[2]) {
                    return match[2];
                }
            }
            return null;
        }

        async function buildAlphaMapFromDataUrl(dataUrl, size) {
            const img = await createImageFromDataUrl(dataUrl);
            const workCanvas = document.createElement('canvas');
            workCanvas.width = size;
            workCanvas.height = size;
            const workCtx = workCanvas.getContext('2d');
            if (!workCtx) throw new Error('无法创建 alpha map 画布');

            workCtx.imageSmoothingEnabled = true;
            workCtx.clearRect(0, 0, size, size);
            workCtx.drawImage(img, 0, 0, size, size);
            const data = workCtx.getImageData(0, 0, size, size).data;
            const alpha = new Float32Array(size * size);

            for (let i = 0, j = 0; i < data.length; i += 4, j++) {
                const maxChannel = Math.max(data[i], data[i + 1], data[i + 2]);
                alpha[j] = maxChannel / 255;
            }

            return alpha;
        }

        function computeSobelMagnitude(source, width, height) {
            const output = new Float32Array(width * height);
            if (width < 3 || height < 3) return output;

            for (let y = 1; y < height - 1; y++) {
                for (let x = 1; x < width - 1; x++) {
                    const p00 = source[(y - 1) * width + (x - 1)];
                    const p01 = source[(y - 1) * width + x];
                    const p02 = source[(y - 1) * width + (x + 1)];
                    const p10 = source[y * width + (x - 1)];
                    const p12 = source[y * width + (x + 1)];
                    const p20 = source[(y + 1) * width + (x - 1)];
                    const p21 = source[(y + 1) * width + x];
                    const p22 = source[(y + 1) * width + (x + 1)];

                    const gx = (-p00 + p02) + (-2 * p10 + 2 * p12) + (-p20 + p22);
                    const gy = (-p00 - 2 * p01 - p02) + (p20 + 2 * p21 + p22);
                    output[y * width + x] = Math.sqrt(gx * gx + gy * gy);
                }
            }

            return output;
        }

        function computeNccScore(a, b) {
            if (!a || !b || a.length !== b.length || a.length === 0) return 0;

            let meanA = 0;
            let meanB = 0;
            for (let i = 0; i < a.length; i++) {
                meanA += a[i];
                meanB += b[i];
            }
            meanA /= a.length;
            meanB /= b.length;

            let num = 0;
            let denA = 0;
            let denB = 0;
            for (let i = 0; i < a.length; i++) {
                const da = a[i] - meanA;
                const db = b[i] - meanB;
                num += da * db;
                denA += da * da;
                denB += db * db;
            }

            const denom = Math.sqrt(denA * denB);
            if (!Number.isFinite(denom) || denom < 1e-8) return 0;
            return num / denom;
        }

        function computeStdDev(data) {
            if (!data || data.length === 0) return 0;
            let sum = 0;
            for (let i = 0; i < data.length; i++) sum += data[i];
            const mean = sum / data.length;
            let varSum = 0;
            for (let i = 0; i < data.length; i++) {
                const d = data[i] - mean;
                varSum += d * d;
            }
            return Math.sqrt(varSum / data.length);
        }

        function getNanoWatermarkConfig(width, height) {
            if (width > 1024 && height > 1024) {
                return { logoSize: 96, marginRight: 64, marginBottom: 64 };
            }
            return { logoSize: 48, marginRight: 32, marginBottom: 32 };
        }

        function getNanoWatermarkRegion(width, height, config) {
            const x = width - config.marginRight - config.logoSize;
            const y = height - config.marginBottom - config.logoSize;
            return {
                x,
                y,
                w: config.logoSize,
                h: config.logoSize
            };
        }

        function extractGrayRegion(imageData, imageWidth, region) {
            const out = new Float32Array(region.w * region.h);
            const src = imageData.data;
            let writeIdx = 0;

            for (let yy = 0; yy < region.h; yy++) {
                const y = region.y + yy;
                for (let xx = 0; xx < region.w; xx++) {
                    const x = region.x + xx;
                    const idx = (y * imageWidth + x) * 4;
                    const gray = (
                        src[idx] * 0.299 +
                        src[idx + 1] * 0.587 +
                        src[idx + 2] * 0.114
                    ) / 255;
                    out[writeIdx++] = gray;
                }
            }

            return out;
        }

        function detectNanoWatermarkConfidence(imageData, alphaMapInfo, region) {
            const imageW = imageData.width;
            const imageH = imageData.height;

            if (region.x < 0 || region.y < 0 || region.x + region.w > imageW || region.y + region.h > imageH) {
                return {
                    detected: false,
                    confidence: 0,
                    spatial: 0,
                    gradient: 0,
                    variance: 0,
                    reason: 'region-out-of-bounds'
                };
            }

            const wmRegion = extractGrayRegion(imageData, imageW, region);
            const spatial = computeNccScore(wmRegion, alphaMapInfo.alpha);

            if (spatial < 0.25) {
                return {
                    detected: false,
                    confidence: clamp(spatial * 0.5, 0, 1),
                    spatial,
                    gradient: 0,
                    variance: 0,
                    reason: 'spatial-low'
                };
            }

            const gradRegion = computeSobelMagnitude(wmRegion, region.w, region.h);
            const gradient = computeNccScore(gradRegion, alphaMapInfo.gradient);

            let varianceScore = 0;
            const refH = Math.min(region.y, region.h);
            if (refH > 8) {
                const refRegion = extractGrayRegion(
                    imageData,
                    imageW,
                    { x: region.x, y: region.y - refH, w: region.w, h: refH }
                );
                const stdWm = computeStdDev(wmRegion);
                const stdRef = computeStdDev(refRegion);
                if (stdRef > 0.02) {
                    varianceScore = clamp(1 - (stdWm / stdRef), 0, 1);
                }
            }

            const confidence = clamp(
                (spatial * 0.5) + (gradient * 0.3) + (varianceScore * 0.2),
                0,
                1
            );
            const detected = confidence >= 0.34 && spatial >= 0.25 && gradient >= -0.04;

            return {
                detected,
                confidence,
                spatial,
                gradient,
                variance: varianceScore,
                reason: detected ? 'ok' : 'confidence-low'
            };
        }

        function applyReverseAlphaBlend(imageData, alphaMapInfo, region, logoValue = 255) {
            const out = new ImageData(
                new Uint8ClampedArray(imageData.data),
                imageData.width,
                imageData.height
            );
            const outData = out.data;
            const alpha = alphaMapInfo.alpha;
            const alphaThreshold = 0.002;
            const maxAlpha = 0.99;
            let activePixels = 0;
            let clippedChannels = 0;
            let deltaSum = 0;

            for (let row = 0; row < region.h; row++) {
                for (let col = 0; col < region.w; col++) {
                    const mapIdx = row * region.w + col;
                    let a = alpha[mapIdx];
                    if (a < alphaThreshold) continue;

                    activePixels++;
                    a = Math.min(a, maxAlpha);
                    const oneMinusA = 1 - a;
                    const imgIdx = ((region.y + row) * out.width + (region.x + col)) * 4;

                    for (let c = 0; c < 3; c++) {
                        const watermarked = outData[imgIdx + c];
                        const original = (watermarked - a * logoValue) / oneMinusA;
                        const restored = clamp(Math.round(original), 0, 255);
                        if (restored === 0 || restored === 255) clippedChannels++;
                        deltaSum += Math.abs(restored - watermarked);
                        outData[imgIdx + c] = restored;
                    }
                }
            }

            const denom = Math.max(1, activePixels * 3);
            return {
                imageData: out,
                stats: {
                    activePixels,
                    clipRatio: clippedChannels / denom,
                    meanDelta: deltaSum / denom
                }
            };
        }

        async function loadNanoAlphaMaps() {
            if (nanoAlphaMapsCache) return nanoAlphaMapsCache;
            if (nanoAlphaLoadPromise) return nanoAlphaLoadPromise;

            nanoAlphaLoadPromise = (async () => {
                for (const url of NANO_ALPHA_SOURCE_URLS) {
                    try {
                        const scriptText = await fetchTextWithTimeout(url, 14000);
                        const bg48 = extractDataUrlFromScript(scriptText, [
                            'bg_48_default',
                            'bg48_default',
                            'bg48DataUrl',
                            'bg_48_data_url'
                        ]);
                        const bg96 = extractDataUrlFromScript(scriptText, [
                            'bg_96_default',
                            'bg96_default',
                            'bg96DataUrl',
                            'bg_96_data_url'
                        ]);
                        if (!bg48 || !bg96) continue;

                        const alpha48 = await buildAlphaMapFromDataUrl(bg48, 48);
                        const alpha96 = await buildAlphaMapFromDataUrl(bg96, 96);
                        nanoAlphaMapsCache = {
                            48: {
                                alpha: alpha48,
                                gradient: computeSobelMagnitude(alpha48, 48, 48)
                            },
                            96: {
                                alpha: alpha96,
                                gradient: computeSobelMagnitude(alpha96, 96, 96)
                            },
                            variants: {},
                            source: url
                        };
                        return nanoAlphaMapsCache;
                    } catch (error) {
                        console.warn('加载 Nano Banana alpha map 失败：', url, error);
                    }
                }
                return null;
            })();

            const result = await nanoAlphaLoadPromise;
            if (!result) {
                nanoAlphaLoadPromise = null;
            }
            return result;
        }

        function resizeAlphaMapBilinear(source, srcSize, dstSize) {
            if (dstSize === srcSize) return new Float32Array(source);
            const out = new Float32Array(dstSize * dstSize);
            const scale = dstSize > 1 ? (srcSize - 1) / (dstSize - 1) : 0;

            for (let y = 0; y < dstSize; y++) {
                const sy = y * scale;
                const y0 = Math.floor(sy);
                const y1 = Math.min(y0 + 1, srcSize - 1);
                const wy = sy - y0;
                for (let x = 0; x < dstSize; x++) {
                    const sx = x * scale;
                    const x0 = Math.floor(sx);
                    const x1 = Math.min(x0 + 1, srcSize - 1);
                    const wx = sx - x0;

                    const v00 = source[y0 * srcSize + x0];
                    const v10 = source[y0 * srcSize + x1];
                    const v01 = source[y1 * srcSize + x0];
                    const v11 = source[y1 * srcSize + x1];
                    const top = v00 * (1 - wx) + v10 * wx;
                    const bottom = v01 * (1 - wx) + v11 * wx;
                    out[y * dstSize + x] = clamp(top * (1 - wy) + bottom * wy, 0, 1);
                }
            }

            return out;
        }

        function getAlphaVariant(alphaMaps, size) {
            const key = String(size);
            if (alphaMaps.variants && alphaMaps.variants[key]) {
                return alphaMaps.variants[key];
            }

            const sourceSize = size <= 64 ? 48 : 96;
            const source = alphaMaps[sourceSize];
            if (!source) return null;
            const alpha = resizeAlphaMapBilinear(source.alpha, sourceSize, size);
            const variant = {
                alpha,
                gradient: computeSobelMagnitude(alpha, size, size),
                size
            };
            alphaMaps.variants[key] = variant;
            return variant;
        }

        function detectNanoWatermarkAdaptive(imageData, alphaMaps) {
            const width = imageData.width;
            const height = imageData.height;
            const shortEdge = Math.min(width, height);
            const baseConfig = getNanoWatermarkConfig(width, height);
            const minSize = Math.max(24, Math.round(shortEdge * 0.045));
            const maxSize = Math.max(minSize + 2, Math.round(shortEdge * 0.4));
            const seeds = [baseConfig.logoSize, 48, 96];
            const scales = [0.72, 0.85, 1, 1.18, 1.36];
            const sizeList = Array.from(
                new Set(
                    seeds
                        .flatMap(seed => scales.map(scale => Math.round(seed * scale)))
                        .filter(size => size >= minSize && size <= maxSize)
                )
            ).sort((a, b) => a - b);
            if (sizeList.length === 0) return null;

            let best = null;
            const marginRatios = [0.45, 2 / 3, 0.82];

            for (const size of sizeList) {
                const alphaVariant = getAlphaVariant(alphaMaps, size);
                if (!alphaVariant) continue;

                const radius = Math.max(8, Math.round(size * 0.72));
                const step = Math.max(2, Math.round(size * 0.12));

                for (const marginRatio of marginRatios) {
                    const margin = Math.round(size * marginRatio);
                    const expectedX = width - margin - size;
                    const expectedY = height - margin - size;

                    for (let oy = -radius; oy <= radius; oy += step) {
                        for (let ox = -radius; ox <= radius; ox += step) {
                            if (Math.abs(ox) + Math.abs(oy) > radius * 1.4) continue;
                            const region = {
                                x: expectedX + ox,
                                y: expectedY + oy,
                                w: size,
                                h: size
                            };
                            if (
                                region.x < 0 || region.y < 0 ||
                                region.x + region.w > width ||
                                region.y + region.h > height
                            ) {
                                continue;
                            }

                            const detection = detectNanoWatermarkConfidence(imageData, alphaVariant, region);
                            const centerX = region.x + region.w * 0.5;
                            const centerY = region.y + region.h * 0.5;
                            const distToCorner = Math.hypot(width - centerX, height - centerY);
                            const normalizedDist = distToCorner / Math.max(1, Math.max(width, height));
                            const score = detection.confidence - normalizedDist * 0.04;

                            if (!best || score > best.score) {
                                best = { detection, region, alphaVariant, score };
                            }
                        }
                    }
                }
            }

            return best;
        }

        async function removeNanoBananaByReverseAlpha(image) {
            const alphaMaps = await loadNanoAlphaMaps();
            if (!alphaMaps) {
                return {
                    image,
                    cleaned: false,
                    method: 'reverse-unavailable',
                    score: 0,
                    reason: 'alpha-map-unavailable'
                };
            }

            const config = getNanoWatermarkConfig(image.width, image.height);
            const region = getNanoWatermarkRegion(image.width, image.height, config);
            const alphaMapInfo = alphaMaps[config.logoSize];
            if (!alphaMapInfo) {
                return {
                    image,
                    cleaned: false,
                    method: 'reverse-unavailable',
                    score: 0,
                    reason: 'alpha-size-missing'
                };
            }

            const workCanvas = document.createElement('canvas');
            workCanvas.width = image.width;
            workCanvas.height = image.height;
            const workCtx = workCanvas.getContext('2d');
            if (!workCtx) {
                return {
                    image,
                    cleaned: false,
                    method: 'reverse-unavailable',
                    score: 0,
                    reason: 'canvas-context-unavailable'
                };
            }
            workCtx.drawImage(image, 0, 0);
            const imageData = workCtx.getImageData(0, 0, image.width, image.height);
            let detection = detectNanoWatermarkConfidence(imageData, alphaMapInfo, region);
            let useRegion = region;
            let useAlphaMap = alphaMapInfo;
            let detectionMode = 'fixed';

            const adaptive = detectNanoWatermarkAdaptive(imageData, alphaMaps);
            if (adaptive && adaptive.detection.detected) {
                const adaptiveBetter = adaptive.detection.confidence > detection.confidence + 0.03;
                if (!detection.detected || adaptiveBetter) {
                    detection = adaptive.detection;
                    useRegion = adaptive.region;
                    useAlphaMap = adaptive.alphaVariant;
                    detectionMode = 'adaptive';
                }
            }

            if (!detection.detected) {
                return {
                    image,
                    cleaned: false,
                    method: 'reverse-low-confidence',
                    score: detection.confidence,
                    rect: useRegion,
                    metrics: {
                        ...detection,
                        mode: detectionMode
                    },
                    reason: detection.reason
                };
            }

            const restored = applyReverseAlphaBlend(imageData, useAlphaMap, useRegion, 255);
            const postDetection = detectNanoWatermarkConfidence(restored.imageData, useAlphaMap, useRegion);
            const confidenceDrop = detection.confidence - postDetection.confidence;
            const spatialDrop = detection.spatial - postDetection.spatial;
            const noImprovement =
                postDetection.confidence >= detection.confidence * 0.92 &&
                confidenceDrop < 0.045 &&
                spatialDrop < 0.04;
            const unstable =
                restored.stats.clipRatio > 0.26 ||
                restored.stats.meanDelta > 62 ||
                noImprovement;
            if (unstable) {
                return {
                    image,
                    cleaned: false,
                    method: 'reverse-unstable',
                    score: detection.confidence,
                    rect: useRegion,
                    metrics: {
                        ...detection,
                        mode: detectionMode,
                        postConfidence: postDetection.confidence,
                        postSpatial: postDetection.spatial,
                        postGradient: postDetection.gradient,
                        confidenceDrop,
                        spatialDrop,
                        noImprovement,
                        ...restored.stats
                    },
                    reason: noImprovement ? 'reverse-no-improvement' : 'reverse-unstable'
                };
            }

            workCtx.putImageData(restored.imageData, 0, 0);
            const cleanedImage = await createImageFromDataUrl(workCanvas.toDataURL('image/png'));
            return {
                image: cleanedImage,
                cleaned: true,
                method: 'reverse-alpha',
                score: detection.confidence,
                rect: useRegion,
                metrics: {
                    ...detection,
                    mode: detectionMode,
                    ...restored.stats
                },
                source: alphaMaps.source
            };
        }

        function getCornerRegions(width, height) {
            const roiW = Math.min(width, Math.max(100, Math.round(width * 0.42)));
            const roiH = Math.min(height, Math.max(52, Math.round(height * 0.24)));
            return [
                { name: 'br', x: width - roiW, y: height - roiH, w: roiW, h: roiH },
                { name: 'tr', x: width - roiW, y: 0, w: roiW, h: roiH },
                { name: 'bl', x: 0, y: height - roiH, w: roiW, h: roiH },
                { name: 'tl', x: 0, y: 0, w: roiW, h: roiH }
            ];
        }

        function buildNanoBananaTemplates(cvLib, baseFontPx) {
            const phrases = ['nano banana', 'Nano Banana', 'NANO BANANA'];
            const families = ['Arial', 'Segoe UI', 'Helvetica'];
            const scales = [0.78, 0.95, 1.1, 1.28, 1.48];
            const templates = [];

            for (const phrase of phrases) {
                for (const family of families) {
                    for (const scale of scales) {
                        const fontSize = Math.max(12, Math.round(baseFontPx * scale));
                        const tCanvas = document.createElement('canvas');
                        const tCtx = tCanvas.getContext('2d');
                        if (!tCtx) continue;

                        tCtx.font = `700 ${fontSize}px ${family}`;
                        const textW = Math.ceil(tCtx.measureText(phrase).width);
                        const padX = Math.max(6, Math.round(fontSize * 0.45));
                        const padY = Math.max(6, Math.round(fontSize * 0.55));

                        tCanvas.width = textW + padX * 2;
                        tCanvas.height = Math.ceil(fontSize * 1.9) + padY;

                        tCtx.fillStyle = '#151515';
                        tCtx.fillRect(0, 0, tCanvas.width, tCanvas.height);
                        tCtx.font = `700 ${fontSize}px ${family}`;
                        tCtx.textBaseline = 'top';
                        tCtx.fillStyle = '#f5f5f5';
                        tCtx.fillText(phrase, padX, Math.round(padY * 0.4));

                        const rgba = cvLib.imread(tCanvas);
                        const gray = new cvLib.Mat();
                        const edge = new cvLib.Mat();
                        cvLib.cvtColor(rgba, gray, cvLib.COLOR_RGBA2GRAY);
                        cvLib.Canny(gray, edge, 50, 150);

                        templates.push({
                            mat: edge,
                            width: edge.cols,
                            height: edge.rows
                        });

                        rgba.delete();
                        gray.delete();
                    }
                }
            }

            return templates;
        }

        function locateNanoBananaWatermark(cvLib, grayMat, imageWidth, imageHeight) {
            const baseFont = Math.max(12, Math.min(36, Math.round(imageWidth / 34)));
            const templates = buildNanoBananaTemplates(cvLib, baseFont);
            const corners = getCornerRegions(imageWidth, imageHeight);
            let best = { score: -1, x: 0, y: 0, w: 0, h: 0, corner: 'br' };

            try {
                for (const corner of corners) {
                    const roiGray = grayMat.roi(new cvLib.Rect(corner.x, corner.y, corner.w, corner.h));
                    const roiEdge = new cvLib.Mat();
                    cvLib.Canny(roiGray, roiEdge, 60, 160);

                    for (const tpl of templates) {
                        if (tpl.width > roiEdge.cols || tpl.height > roiEdge.rows) continue;

                        const result = new cvLib.Mat();
                        cvLib.matchTemplate(roiEdge, tpl.mat, result, cvLib.TM_CCOEFF_NORMED);
                        const mm = cvLib.minMaxLoc(result);
                        result.delete();

                        if (mm.maxVal > best.score) {
                            best = {
                                score: mm.maxVal,
                                x: corner.x + mm.maxLoc.x,
                                y: corner.y + mm.maxLoc.y,
                                w: tpl.width,
                                h: tpl.height,
                                corner: corner.name
                            };
                        }
                    }

                    roiEdge.delete();
                    roiGray.delete();

                    if (corner.name === 'br' && best.score >= 0.56) break;
                }
            } finally {
                templates.forEach(tpl => tpl.mat.delete());
            }

            return best;
        }

        function fallbackWatermarkRect(width, height) {
            const shortEdge = Math.min(width, height);
            const margin = Math.min(Math.max(2, Math.round(shortEdge * 0.015)), Math.max(2, Math.floor(shortEdge / 3)));
            const maxW = Math.max(1, width - margin * 2);
            const maxH = Math.max(1, height - margin * 2);
            const targetW = Math.min(maxW, Math.max(40, Math.round(width * 0.22)));
            const targetH = Math.min(maxH, Math.max(20, Math.round(height * 0.09)));
            const x = clamp(width - targetW - margin, 0, Math.max(0, width - targetW));
            const y = clamp(height - targetH - margin, 0, Math.max(0, height - targetH));
            return {
                x,
                y,
                w: Math.max(1, targetW),
                h: Math.max(1, targetH)
            };
        }

        function expandRect(rect, padX, padY, maxW, maxH) {
            const x = Math.max(0, Math.floor(rect.x - padX));
            const y = Math.max(0, Math.floor(rect.y - padY));
            const right = Math.min(maxW, Math.ceil(rect.x + rect.w + padX));
            const bottom = Math.min(maxH, Math.ceil(rect.y + rect.h + padY));
            return {
                x,
                y,
                w: Math.max(1, right - x),
                h: Math.max(1, bottom - y)
            };
        }

        async function patchFillFallback(image, targetRect) {
            const workCanvas = document.createElement('canvas');
            workCanvas.width = image.width;
            workCanvas.height = image.height;
            const workCtx = workCanvas.getContext('2d');
            if (!workCtx) return image;

            workCtx.drawImage(image, 0, 0);

            let sampleX = targetRect.x - targetRect.w - 6;
            let sampleY = targetRect.y;
            if (sampleX < 0) {
                sampleX = targetRect.x;
                sampleY = Math.max(0, targetRect.y - targetRect.h - 6);
            }
            sampleX = clamp(sampleX, 0, Math.max(0, image.width - targetRect.w));
            sampleY = clamp(sampleY, 0, Math.max(0, image.height - targetRect.h));

            const sampleCanvas = document.createElement('canvas');
            sampleCanvas.width = targetRect.w;
            sampleCanvas.height = targetRect.h;
            const sampleCtx = sampleCanvas.getContext('2d');
            if (!sampleCtx) return image;
            sampleCtx.drawImage(
                workCanvas,
                sampleX, sampleY, targetRect.w, targetRect.h,
                0, 0, targetRect.w, targetRect.h
            );

            workCtx.save();
            workCtx.globalAlpha = 0.92;
            workCtx.filter = 'blur(1px)';
            workCtx.drawImage(sampleCanvas, targetRect.x, targetRect.y, targetRect.w, targetRect.h);
            workCtx.restore();

            workCtx.save();
            const gradient = workCtx.createLinearGradient(
                targetRect.x, targetRect.y,
                targetRect.x + targetRect.w, targetRect.y + targetRect.h
            );
            gradient.addColorStop(0, 'rgba(0,0,0,0.05)');
            gradient.addColorStop(0.5, 'rgba(0,0,0,0)');
            gradient.addColorStop(1, 'rgba(0,0,0,0.05)');
            workCtx.fillStyle = gradient;
            workCtx.fillRect(targetRect.x, targetRect.y, targetRect.w, targetRect.h);
            workCtx.restore();

            return createImageFromDataUrl(workCanvas.toDataURL('image/png'));
        }

        async function removeNanoBananaByInpaint(image) {
            const cvReady = typeof window.__waitForCv === 'function'
                ? await window.__waitForCv(9000)
                : false;

            if (!cvReady || !window.cv || typeof window.cv.Mat !== 'function') {
                return {
                    image,
                    cleaned: false,
                    method: 'inpaint-unavailable',
                    score: 0,
                    reason: window.__cvState?.error || 'OpenCV 未就绪'
                };
            }

            const cvLib = window.cv;
            const workCanvas = document.createElement('canvas');
            workCanvas.width = image.width;
            workCanvas.height = image.height;
            const workCtx = workCanvas.getContext('2d');
            if (!workCtx) return { image, cleaned: false, method: 'failed', score: 0, reason: 'Canvas 上下文不可用' };
            workCtx.drawImage(image, 0, 0);

            const srcRgba = cvLib.imread(workCanvas);
            const srcBgr = new cvLib.Mat();
            const gray = new cvLib.Mat();
            const mask = cvLib.Mat.zeros(srcRgba.rows, srcRgba.cols, cvLib.CV_8UC1);
            const dstBgr = new cvLib.Mat();
            const dstRgba = new cvLib.Mat();

            try {
                cvLib.cvtColor(srcRgba, srcBgr, cvLib.COLOR_RGBA2BGR);
                cvLib.cvtColor(srcRgba, gray, cvLib.COLOR_RGBA2GRAY);

                const candidate = locateNanoBananaWatermark(cvLib, gray, image.width, image.height);
                const templateScore = Number.isFinite(candidate.score) ? candidate.score : 0;
                const strongThreshold = 0.58;
                if (!candidate.w || !candidate.h || templateScore < strongThreshold) {
                    return {
                        image,
                        cleaned: false,
                        method: 'inpaint-low-confidence',
                        score: Math.max(0, templateScore),
                        rect: fallbackWatermarkRect(image.width, image.height),
                        reason: 'template-low-confidence'
                    };
                }

                const maskRect = expandRect(
                    candidate,
                    Math.round(candidate.w * 0.45),
                    Math.round(candidate.h * 0.7),
                    image.width,
                    image.height
                );

                cvLib.rectangle(
                    mask,
                    new cvLib.Point(maskRect.x, maskRect.y),
                    new cvLib.Point(maskRect.x + maskRect.w, maskRect.y + maskRect.h),
                    new cvLib.Scalar(255, 255, 255, 255),
                    -1
                );

                const dilateRadius = Math.max(1, Math.round(Math.min(maskRect.w, maskRect.h) * 0.08));
                const kernelSize = dilateRadius * 2 + 1;
                const kernel = cvLib.getStructuringElement(
                    cvLib.MORPH_ELLIPSE,
                    new cvLib.Size(kernelSize, kernelSize)
                );
                cvLib.dilate(mask, mask, kernel);
                kernel.delete();

                cvLib.inpaint(srcBgr, mask, dstBgr, 3, cvLib.INPAINT_TELEA);
                cvLib.cvtColor(dstBgr, dstRgba, cvLib.COLOR_BGR2RGBA);
                cvLib.imshow(workCanvas, dstRgba);

                const cleanedImage = await createImageFromDataUrl(workCanvas.toDataURL('image/png'));
                return {
                    image: cleanedImage,
                    cleaned: true,
                    method: 'inpaint-template',
                    score: Math.max(0, candidate.score || 0),
                    rect: maskRect
                };
            } catch (error) {
                console.error('inpaint 去水印失败：', error);
                return {
                    image,
                    cleaned: false,
                    method: 'inpaint-error',
                    score: 0,
                    reason: error.message || 'OpenCV 去水印异常'
                };
            } finally {
                srcRgba.delete();
                srcBgr.delete();
                gray.delete();
                mask.delete();
                dstBgr.delete();
                dstRgba.delete();
            }
        }

        async function removeNanoBananaWatermark(image) {
            const reverseResult = await removeNanoBananaByReverseAlpha(image);
            if (reverseResult.cleaned) {
                return reverseResult;
            }

            const inpaintResult = await removeNanoBananaByInpaint(image);
            if (inpaintResult.cleaned) {
                inpaintResult.score = Math.max(inpaintResult.score || 0, reverseResult.score || 0);
                inpaintResult.note = reverseResult.method || '';
                return inpaintResult;
            }

            const method = (
                reverseResult.method === 'reverse-unavailable' &&
                inpaintResult.method === 'inpaint-unavailable'
            ) ? 'cleanup-unavailable' : 'no-watermark';

            return {
                image,
                cleaned: false,
                method,
                score: Math.max(reverseResult.score || 0, inpaintResult.score || 0),
                reason: `${reverseResult.method || 'reverse-none'}|${inpaintResult.method || 'inpaint-none'}`,
                details: {
                    reverse: reverseResult,
                    inpaint: inpaintResult
                }
            };
        }

        async function runCleanupFromSource(loadToken, options = {}) {
            if (!sourceImage) return;
            const manual = !!options.manual;
            const keepCrop = !!options.keepCrop;
            const jobId = ++cleanupJobId;
            isCleanupRunning = true;
            updateCleanupButtonsState();
            setWatermarkStatus(manual ? '正在重新去水印...' : '导入完成，正在自动去水印...', 'info');
            try {
                const result = await removeNanoBananaWatermark(sourceImage);
                if (loadToken !== activeImageLoadToken) return;

                const currentItem = getCurrentBatchItem();
                if (currentItem && currentItem.sourceImage === sourceImage) {
                    currentItem.processedImage = result.image;
                    currentItem.cleanupMeta = result;
                }

                applyImageToEditor(result.image, { keepCrop });
                const confidence = Math.round((result.score || 0) * 100);
                if (result.method === 'reverse-alpha') {
                    setWatermarkStatus(`已完成去水印（反向 Alpha，置信度 ${confidence}%）`, 'success');
                } else if (result.method === 'inpaint-template') {
                    setWatermarkStatus(`已完成去水印（模板置信度 ${confidence}%）`, 'success');
                } else if (result.method === 'no-watermark') {
                    setWatermarkStatus('未检测到稳定水印，已保留原图', 'neutral');
                } else if (result.method === 'reverse-unstable') {
                    setWatermarkStatus('检测到反向恢复异常，已保留原图', 'warn');
                } else if (result.method === 'reverse-low-confidence') {
                    setWatermarkStatus(`低置信度（${confidence}%），已保留原图`, 'neutral');
                } else if (result.method === 'cleanup-unavailable') {
                    setWatermarkStatus('去印引擎不可用，已保留原图', 'warn');
                } else if (result.method === 'inpaint-low-confidence') {
                    setWatermarkStatus('模板置信度不足，已保留原图', 'neutral');
                } else if (result.method === 'inpaint-error') {
                    setWatermarkStatus('inpaint 处理异常，已保留原图', 'warn');
                } else if (result.method === 'inpaint-unavailable') {
                    setWatermarkStatus('inpaint 不可用，已保留原图', 'warn');
                } else if (result.method === 'reverse-unavailable') {
                    setWatermarkStatus('反向 Alpha 不可用，已保留原图', 'warn');
                } else if (result.method === 'patch-fallback') {
                    setWatermarkStatus('已完成去水印（OpenCV 不可用，使用纹理覆盖兜底）', 'warn');
                } else {
                    setWatermarkStatus('已完成去水印', 'success');
                }
            } catch (error) {
                console.error('runCleanupFromSource error:', error);
                if (loadToken === activeImageLoadToken) {
                    const currentItem = getCurrentBatchItem();
                    if (currentItem && currentItem.sourceImage === sourceImage) {
                        currentItem.processedImage = currentItem.sourceImage;
                        currentItem.cleanupMeta = { method: 'original', score: 0 };
                    }
                    applyImageToEditor(sourceImage, { keepCrop });
                    setWatermarkStatus('去水印异常，已回退到原图', 'error');
                }
            } finally {
                if (jobId === cleanupJobId) {
                    isCleanupRunning = false;
                    updateCleanupButtonsState();
                }
            }
        }

        async function rerunWatermarkCleanup() {
            const currentItem = getCurrentBatchItem();
            if (!currentItem || isCleanupRunning || isBatchGenerating) return;
            sourceImage = currentItem.sourceImage;
            const loadToken = ++activeImageLoadToken;
            await runCleanupFromSource(loadToken, { manual: true, keepCrop: true });
            updateCleanupButtonsState();
        }

        function restoreSourceImage() {
            const currentItem = getCurrentBatchItem();
            if (!currentItem || isCleanupRunning || isBatchGenerating) return;
            activeImageLoadToken++;
            sourceImage = currentItem.sourceImage;
            currentItem.processedImage = currentItem.sourceImage;
            currentItem.cleanupMeta = { method: 'restored', score: 0 };
            applyImageToEditor(currentItem.sourceImage, { keepCrop: true });
            setWatermarkStatus('已恢复导入原图', 'neutral');
            updateCleanupButtonsState();
        }

        // --- 核心功能 (比例逻辑更新) ---

        // 1. 获取当前目标 *单个格子* 的比例，并转换为 *整个裁切框* 应该有的比例
        // 修正逻辑：如果用户选 1:1，是希望格子是 1:1。
        // 总宽/总高 = (格宽 * 列数) / (格高 * 行数) = (格宽/格高) * (列数/行数) = 单元比例 * (列数/行数)
        function getEffectiveTotalRatio() {
            const select = document.getElementById('aspectSelect');
            if (select.value === 'free') return null;

            let cellRatio;
            if (select.value === 'custom') {
                const w = parseFloat(document.getElementById('customW').value) || 1;
                const h = parseFloat(document.getElementById('customH').value) || 1;
                cellRatio = w / h;
            } else {
                cellRatio = parseFloat(select.value);
            }

            const rows = parseInt(document.getElementById('rowsInput').value) || 1;
            const cols = parseInt(document.getElementById('colsInput').value) || 1;
            
            // 返回修正后的总比例
            return cellRatio * (cols / rows);
        }

        // 2. 处理比例变化
        function handleRatioChange() {
            const select = document.getElementById('aspectSelect');
            const customBox = document.getElementById('customRatioBox');
            
            // 显示/隐藏自定义框
            if (select.value === 'custom') {
                customBox.classList.remove('hidden');
                customBox.classList.add('grid');
            } else {
                customBox.classList.add('hidden');
                customBox.classList.remove('grid');
            }

            // 立即应用到当前裁切框
            applyAspectRatioToCurrentCrop();
        }

        function applyAspectRatioToCurrentCrop() {
            if (!originalImage) return;
            const totalRatio = getEffectiveTotalRatio();
            if (!totalRatio) return; // 自由模式不强制改变

            // 保持宽度，调整高度以适应新的总比例
            let newH = cropState.w / totalRatio;
            
            // 如果高度超出图片边界，则反向调整宽度
            if (cropState.y + newH > originalImage.height) {
                newH = originalImage.height - cropState.y;
                // 再次调整宽度以匹配被限制的高度
                let newW = newH * totalRatio;
                if(cropState.x + newW > originalImage.width) {
                   // 极少数情况宽高都受限，简单重置
                   centerCropBox();
                   return;
                }
                cropState.w = newW;
                cropState.h = newH;
            } else {
                cropState.h = newH;
            }

            updateInputsFromCrop();
            drawCanvas();
        }

        async function handleFileSelect(e) {
            const files = Array.from(e.target.files || []).filter(file => !file.type || file.type.startsWith('image/'));
            fileInput.value = '';
            if (!files.length) return;

            const loadToken = ++activeImageLoadToken;
            cleanupJobId++;
            isBatchGenerating = false;
            isCleanupRunning = true;
            resetBatchCollection();
            updateCleanupButtonsState();

            const shouldAutoCleanup = document.getElementById('autoWatermarkToggle').checked;
            const importedItems = [];
            let failed = 0;

            for (let i = 0; i < files.length; i++) {
                if (loadToken !== activeImageLoadToken) return;
                const file = files[i];
                const displayName = file.name || `image_${i + 1}.png`;

                try {
                    setWatermarkStatus(`正在读取 ${i + 1}/${files.length}: ${displayName}`, 'info');
                    const dataUrl = await readFileAsDataUrl(file);
                    const incomingImage = await createImageFromDataUrl(dataUrl);

                    const item = {
                        name: displayName,
                        sourceImage: incomingImage,
                        processedImage: incomingImage,
                        cleanupMeta: { method: 'original', score: 0 }
                    };

                    if (shouldAutoCleanup) {
                        setWatermarkStatus(`正在去水印 ${i + 1}/${files.length}: ${displayName}`, 'info');
                        const result = await removeNanoBananaWatermark(incomingImage);
                        if (loadToken !== activeImageLoadToken) return;
                        item.processedImage = result.image;
                        item.cleanupMeta = result;
                    }

                    importedItems.push(item);
                } catch (error) {
                    failed++;
                    console.error(`导入失败（${displayName}）：`, error);
                }
            }

            if (loadToken !== activeImageLoadToken) return;
            batchItems = importedItems;
            currentBatchIndex = importedItems.length ? 0 : -1;
            sourceImage = importedItems.length ? importedItems[0].sourceImage : null;

            if (importedItems.length) {
                switchToBatchItem(0, { keepCrop: false });
                if (failed > 0) {
                    setWatermarkStatus(`已导入 ${importedItems.length} 张，失败 ${failed} 张`, 'warn');
                } else if (!shouldAutoCleanup) {
                    setWatermarkStatus(`已导入 ${importedItems.length} 张（自动去水印关闭）`, 'neutral');
                }
            } else {
                setWatermarkStatus('未成功导入图片，请重试', 'error');
                document.getElementById('empty-state').style.display = 'block';
            }

            isCleanupRunning = false;
            updateCleanupButtonsState();
        }
